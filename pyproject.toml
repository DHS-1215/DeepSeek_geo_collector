[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "deepseek-geo-collector"
version = "0.1.0"
description = "Independent DeepSeek GEO collection system"
requires-python = ">=3.11"

dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "tests*",
    "data*",
    "config*",
    "output*",
    "browser_profile*",
    "scripts*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"


[tool.ruff]
target-version = "py311"
line-length = 100